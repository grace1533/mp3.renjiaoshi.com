{extend name="public/common"/}
{block name="topnav"}{/block}
{block name="content"}
<div class="tm_div  clearfix">
	<h2>{$data['name']} </h2>
	<div class="pgs">讲员：<a target="_blank" href="{$data['artist_url']}">{$data['artist_name']} </a></div>
</div>
<div class="tour_div ">
	<div id="song-play" class="mt10 clearfix">
		<span class="img_border">
			<a target="_blank" title="{$data['name']}" href="javascript:;">
				<img class="br100" alt="{$data['name']}" src="{$data['cover_url']}">
			</a>
		</span>
		<div class="playerBtn">
			{JY:prev result="p"}
			<a class="jp-previous" href="{$p['url']}"></a>
			{/JY:prev}
			<a class="jp-play" href="javascript:;" style="display: none;"></a>
			<a class="jp-pause" href="javascript:;" style="display: block;"></a>

			{JY:next result="n"}
			<a class="jp-next" href="{$n['url']}"></a>
			{/JY:next}
		</div>
		
		<span class="jp-current-time">00:00</span>
		<div class="jp-progress">
			<div class="jp-seek-bar">						
				<div class="jp-play-bar" style="width: 2%;">
					<a class="bar" href="javascript:;"></a>
				</div>
			</div>
		</div>
		<span class="jp-duration">00:00</span>
	</div>	
</div>
<div>



				
				

<div class="tm_div  clearfix">
	<div class="tour_title tc0" >点击两边的按钮可以选择上一篇或者下一篇<br/>点击播放器下方的时间线快进或快退</div>
</div>

{/block}
{block name="script"}
<script type="text/javascript" src="__JS__/jquery.jplayer.min.js"></script>
<script type="text/javascript" src="__JS__/player.js"></script>
<script type="text/javascript">
    setplayer("{:url('api/v1.Songs/read', ['id' => $data['id']])}");
</script>
